name: Build Crimson (Windows)

# Compiles Crimson.dll in Release on a GitHub Windows runner and attaches it to the run as a downloadable artifact.
# Runs on every push to the mouse-camera branch. On failure, the relevant error lines are written to the run's
# Summary page so they can be read without opening the raw logs.
on:
  workflow_dispatch:
  push:
    branches: [mouse-camera]

permissions:
  contents: write   # needed to publish the GitHub Release below

jobs:
  build:
    # The project targets Visual Studio 2022; windows-latest no longer ships it.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment info
        shell: pwsh
        run: |
          $s = $env:GITHUB_STEP_SUMMARY
          "## Environment" | Out-File $s -Append -Encoding utf8
          '```' | Out-File $s -Append -Encoding utf8
          "cmake: " + (cmake --version | Select-Object -First 1) | Out-File $s -Append -Encoding utf8
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -all -prerelease -format json | ConvertFrom-Json | ForEach-Object {
              "VS: $($_.displayName) $($_.installationVersion)" | Out-File $s -Append -Encoding utf8
            }
          } else {
            "vswhere not found" | Out-File $s -Append -Encoding utf8
          }
          '```' | Out-File $s -Append -Encoding utf8

      - name: Configure (Visual Studio 2022, x64)
        shell: pwsh
        run: |
          $label = "build-${{ github.run_number }}-" + "${{ github.sha }}".Substring(0, 7)
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCRIMSON_BUILD_LABEL=$label" *> configure.log
          $code = $LASTEXITCODE
          Get-Content configure.log -Tail 20
          exit $code

      - name: Build (Release)
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel *> build.log
          $code = $LASTEXITCODE
          Get-Content build.log -Tail 20
          exit $code

      - name: Upload DLLs
        uses: actions/upload-artifact@v4
        with:
          name: Crimson-Release
          path: |
            build/bin/Release/Crimson.dll
            build/bin/Release/dinput8_injector.dll
          if-no-files-found: error

      - name: Publish GitHub Release
        # Only for successful pushes to mouse-camera. Gives a permanent download link (no login needed),
        # tagged build-<run number> so the latest release is always the newest build.
        if: success() && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          $tag = "build-${{ github.run_number }}"
          $notes = "Commit ${{ github.sha }}`n`n$env:COMMIT_MSG"
          gh release create $tag `
            build/bin/Release/Crimson.dll `
            build/bin/Release/dinput8_injector.dll `
            --target ${{ github.sha }} `
            --title "Crimson build #${{ github.run_number }}" `
            --notes $notes `
            --latest

      - name: Report errors to the run Summary
        if: failure()
        shell: pwsh
        run: |
          $s = $env:GITHUB_STEP_SUMMARY
          # Annotations are readable on the run page and through the API even without opening the raw logs.
          function Annot($title, $lines) {
            $text = ($lines -join "`n")
            if ($text.Length -gt 3500) { $text = $text.Substring($text.Length - 3500) }
            $text = $text.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=$title::$text"
          }
          foreach ($f in 'configure.log', 'build.log') {
            if (Test-Path $f) {
              Annot "$f tail" (Get-Content $f -Tail 40)
              $e = Select-String -Path $f -Pattern 'error' | Select-Object -First 15 | ForEach-Object { $_.Line }
              if ($e) { Annot "$f errors" $e }
            }
          }
          foreach ($f in 'configure.log', 'build.log') {
            if (Test-Path $f) {
              "## $f - last 60 lines" | Out-File $s -Append -Encoding utf8
              '```' | Out-File $s -Append -Encoding utf8
              Get-Content $f -Tail 60 | Out-File $s -Append -Encoding utf8
              '```' | Out-File $s -Append -Encoding utf8
              $errs = Select-String -Path $f -Pattern 'error' | Select-Object -First 40 | ForEach-Object { $_.Line }
              if ($errs) {
                "## $f - lines mentioning 'error' (first 40)" | Out-File $s -Append -Encoding utf8
                '```' | Out-File $s -Append -Encoding utf8
                $errs | Out-File $s -Append -Encoding utf8
                '```' | Out-File $s -Append -Encoding utf8
              }
            }
          }
